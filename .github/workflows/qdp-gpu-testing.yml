name: QDP GPU Testing

# The Rust GPU tests (qdp/qdp-core/tests/gpu_*.rs) need a CUDA device, which
# GitHub's runners don't have, so python-testing.yml builds against CUDA stubs
# and the GPU cases never run. This runs them on a simulated NVIDIA T4
# (PantheonSim), which executes the kernels from their PTX on the runner's CPU.
# It checks results, not speed; a real GPU is still the final word.

on:
  push:
    branches: [main]
    paths:
      - "qdp/qdp-core/**"
      - "qdp/qdp-kernels/**"
      - "qdp/**/Cargo.toml"
      - "qdp/Cargo.lock"
      - ".github/workflows/qdp-gpu-testing.yml"
  pull_request:
    branches: [main]
    paths:
      - "qdp/qdp-core/**"
      - "qdp/qdp-kernels/**"
      - "qdp/**/Cargo.toml"
      - "qdp/Cargo.lock"
      - ".github/workflows/qdp-gpu-testing.yml"
  workflow_dispatch:

# The job reads the repository and nothing else. The simulator's action uses
# no token or secrets, and installs packages only from Ubuntu and NVIDIA.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qdp-gpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up CUDA and a simulated GPU
        uses: pantheongpu/setup-pantheonsim@06648b8c0cb091584196678593215db2e16bd7eb # v0.1.2
        with:
          gpu: nvidia/t4
          cuda-toolkit: "12.8"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # 75+ptx embeds PTX for the simulated T4, which the simulator runs.
      - name: Run the GPU tests
        working-directory: qdp
        env:
          CUDA_PATH: /usr/local/cuda-12.8
          QDP_CUDA_ARCH_LIST: "75+ptx"
        run: >
          cargo test -p qdp-core
          --test gpu_angle_encoding --test gpu_api_workflow --test gpu_basis_encoding
          --test gpu_dlpack --test gpu_fidelity --test gpu_iqp_encoding
          --test gpu_memory_safety --test gpu_norm_f32 --test gpu_ptr_encoding
          --test gpu_validation
